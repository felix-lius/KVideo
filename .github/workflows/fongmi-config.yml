name: Update FongMi config

on:
  push:
    branches: [main]
    paths:
      - video2.json
      - lib/server/fongmi-config.ts
      - scripts/generate-fongmi-config.ts
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fongmi-config-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run fongmi:generate
      - name: Commit updated config
        run: |
          if git diff --quiet -- fongmi.json; then
            echo "FongMi config is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fongmi.json
          git commit -m "chore: sync FongMi config with video2.json"
          git push origin HEAD:main
